version: '3.8'

services:
  # ============================================================
  # 1. PostgreSQL Database Service
  # ============================================================
  db:
    image: postgres:16-alpine
    container_name: ncc_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ncc_command_db}
    ports:
      - "5432:5432"
    volumes:
      - ncc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ncc_command_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ncc-network

  # ============================================================
  # 2. Express + Prisma Backend Service
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ncc_backend_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5050
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-ncc_command_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-ncc_secure_military_grade_jwt_secret_ait_2026}
      CORS_ORIGIN: http://localhost,http://localhost:3000,http://127.0.0.1:3000
      SMTP_HOST: ${SMTP_HOST:-smtp.ethereal.email}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-ncc.command@aitpune.edu.in}
      SMTP_PASS: ${SMTP_PASS:-mock_secure_password}
    ports:
      - "5050:5050"
    networks:
      - ncc-network

  # ============================================================
  # 3. React SPA + Nginx Frontend Service
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ncc_frontend_web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
      - "80:80"
    networks:
      - ncc-network

volumes:
  ncc_pgdata:
    driver: local

networks:
  ncc-network:
    driver: bridge
