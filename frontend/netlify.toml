[build]
  publish = "dist"
  command = "npm run build"

[functions]
  directory = "netlify/functions"

# Keep the branch-specific staging build settings in this config as well as
# the repository-root netlify.toml. Some Netlify sites explicitly select this
# file as their config path when the frontend directory is the site base.
[context.ncc-staging]
  command = "NCC_STAGING_API_MODE=true VITE_PUBLIC_PREVIEW_MODE=false NCC_PUBLIC_PREVIEW_MODE=false VITE_API_BASE_URL=https://ait-ncc-backend.onrender.com npm run build"

[context.ncc-staging.environment]
  NCC_STAGING_API_MODE = "true"
  VITE_PUBLIC_PREVIEW_MODE = "false"
  NCC_PUBLIC_PREVIEW_MODE = "false"
  VITE_API_BASE_URL = "https://ait-ncc-backend.onrender.com"
