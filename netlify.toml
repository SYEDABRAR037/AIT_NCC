[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[functions]
  directory = "netlify/functions"

# AI Facial recognition neural network models
[[headers]]
  for = "/models/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-DNS-Prefetch-Control = "off"
    X-Permitted-Cross-Domain-Policies = "none"
    # CSP is emitted by the build script so deploy previews can use a stricter,
    # context-specific connect-src without changing the production policy.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Public previews are static-only. Netlify headers/redirects are global when
# declared here, so preview-specific files are emitted into dist at build time.
[context.production.environment]
  # This site's production branch is a public static preview, not an API-backed deployment.
  VITE_PUBLIC_PREVIEW_MODE = "true"
  NCC_PUBLIC_PREVIEW_MODE = "true"

[context.deploy-preview.environment]
  VITE_PUBLIC_PREVIEW_MODE = "true"
  NCC_PUBLIC_PREVIEW_MODE = "true"

[context.branch-deploy.environment]
  VITE_PUBLIC_PREVIEW_MODE = "true"
  NCC_PUBLIC_PREVIEW_MODE = "true"

[context."codex/ncc-release-candidate-20261028".environment]
  VITE_PUBLIC_PREVIEW_MODE = "true"
  NCC_PUBLIC_PREVIEW_MODE = "true"

# A narrowly scoped API-backed staging build. The build script independently
# verifies the branch, context, flags, and exact backend URL before using it.
[context.ncc-staging]
  # Set these in the command environment as well as the branch context so Vite
  # receives the staging values before it compiles import.meta.env.
  command = "NCC_STAGING_API_MODE=true VITE_PUBLIC_PREVIEW_MODE=false NCC_PUBLIC_PREVIEW_MODE=false VITE_API_BASE_URL=https://ait-ncc-backend-staging.onrender.com npm run build"

[context.ncc-staging.environment]
  NCC_STAGING_API_MODE = "true"
  VITE_PUBLIC_PREVIEW_MODE = "false"
  NCC_PUBLIC_PREVIEW_MODE = "false"
  VITE_API_BASE_URL = "https://ait-ncc-backend-staging.onrender.com"